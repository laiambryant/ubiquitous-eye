name: Deploy site

on:
  push:
    branches:
      - main
  # Rebuild daily so new repositories and profile changes show up without a push.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Test
        working-directory: src
        run: go test ./...

      - name: Generate site
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          go run .
          -user laiambryant
          -email liambryant@outlook.it
          -role "Software Developer"
          -out ../docs

      # GitHub Pages serves /docs from the deploy branch. Each deploy commit is
      # main's tree plus the freshly generated site, with both main and the
      # previous deploy as parents, so the push is always a fast-forward.
      - name: Publish to deploy branch
        run: |
          git fetch origin deploy
          git add docs
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'origin/deploy^{tree}')" ]; then
            echo "Site unchanged, nothing to deploy."
            exit 0
          fi
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -p origin/deploy -p HEAD -m "chore(pages): regenerate site")
          git push origin "$commit:refs/heads/deploy"
