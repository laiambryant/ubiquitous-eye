name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch deploy branch
        run: git fetch origin deploy

      - name: Checkout deploy branch
        run: git checkout -B deploy origin/deploy

      - name: Merge main into deploy
        run: git merge --no-edit origin/main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: src/go.sum

      - name: Run tests
        working-directory: src
        run: go test ./...

      - name: Generate site
        working-directory: src
        run: go run main.go

      - name: Commit generated site
        run: |
          git add docs
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(pages): regenerate site"
          fi

      - name: Push deploy branch
        run: git push origin deploy
