<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> | Portfolio</title>
    <meta name="description" content="">
    <meta property="og:title" content=" | Portfolio">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/site.css?v=c9bc951">
</head>
<body data-theme="light">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="top">
        <div class="container header-content">
            <a class="logo" href="#top"></a>
            <nav class="site-nav" aria-label="Primary">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </nav>
            <button class="theme-toggle" type="button" data-theme-toggle>
                Toggle theme
            </button>
        </div>
    </header>

    <main id="main">
        <section class="hero">
            <div class="container hero-grid">
                <div class="hero-copy">
                    <p class="eyebrow">Software Engineer</p>
                    <h1></h1>
                    <div class="hero-actions">
                        <a class="button primary" href="" target="_blank" rel="noopener noreferrer">GitHub</a>
                        <a class="button ghost" href="mailto:liambryant@outlook.it">Email</a>
                    </div>
                    <dl class="hero-stats">
                        <div>
                            <dt>Repos</dt>
                            <dd>0</dd>
                        </div>
                        <div>
                            <dt>Location</dt>
                            <dd></dd>
                        </div>
                    </dl>
                </div>
                <div class="hero-card">
                    <img src="" alt="Portrait of " width="360" height="360" loading="eager">
                </div>
            </div>
        </section>

        <section class="section projects" id="projects">
            <div class="container">
                <div class="projects-shell">
                    <div class="projects-header">
                        <div class="section-heading">
                            <p class="eyebrow">Projects</p>
                            <h2>Selected work and experiments.</h2>
                        </div>
                        <div class="projects-summary">
                            <span data-project-count>0</span> repositories
                        </div>
                    </div>

                    <div class="projects-toolbar" data-project-toolbar>
                        <label>
                            Search
                            <input type="search" placeholder="Search projects" data-project-search>
                        </label>
                        <label>
                            Language
                            <select data-filter-language>
                                <option value="all">All</option>
                            </select>
                        </label>
                        <label>
                            Topic
                            <select data-filter-topic>
                                <option value="all">All</option>
                            </select>
                        </label>
                        <label>
                            Sort
                            <select data-project-sort>
                                <option value="name-asc">Name (A-Z)</option>
                            </select>
                        </label>
                    </div>

                    <div class="projects-grid" data-project-grid>
                    
                    </div>
                    <p class="empty-state" data-empty-state hidden>No projects match the current filters.</p>
                </div>
            </div>
        </section>

        <section class="section contact" id="contact">
            <div class="container">
                <div class="section-heading">
                    <p class="eyebrow">Contact</p>
                </div>
                <div class="contact-grid">
                    <div class="contact-card">
                        <h3>Email</h3>
                        <p><a href="mailto:liambryant@outlook.it">liambryant@outlook.it</a></p>
                    </div>
                    <div class="contact-card">
                        <h3>GitHub</h3>
                        <p><a href="" target="_blank" rel="noopener noreferrer"></a></p>
                    </div>
                    <div class="contact-card">
                        <h3>Location</h3>
                        <p></p>
                    </div>
                    
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <span>Last build c9bc951</span>
            <span>&copy; 2026 </span>
            <a href="#top">Back to top</a>
        </div>
    </footer>

    <script src="assets/site.js?v=c9bc951" defer></script>
</body>
</html>
